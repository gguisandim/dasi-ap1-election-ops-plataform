name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: SPEC traceability
        run: npm run spec:check
      - name: Workspace boundaries
        run: npm run check:boundaries
      - name: Prisma schema
        run: npm run db:validate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # End-to-end exige banco migrado e semeado, além do artefato de frontend.
  # O job sobe seu próprio PostgreSQL; nenhum segredo externo é necessário, e
  # por isso não existe caminho de skip silencioso: se o ambiente falhar, o job
  # falha de forma visível.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [static, unit]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: eops
          POSTGRES_PASSWORD: eops
          POSTGRES_DB: eops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eops -d eops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://eops:eops@127.0.0.1:5432/eops?schema=public
      JWT_SECRET: e2e-ci-secret-with-at-least-24-characters
      DEMO_ADMIN_PASSWORD: DemoElectionOps2026!
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npx prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - name: Seed demo data
        run: npm run db:seed
      - run: npm run build
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end suite
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results
          retention-days: 7
