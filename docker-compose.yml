services:
  postgres:
    image: postgres:17-alpine
    container_name: election-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: election_ops
      POSTGRES_USER: eops
      POSTGRES_PASSWORD: eops_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eops -d election_ops"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - election_ops_postgres_data:/var/lib/postgresql/data

volumes:
  election_ops_postgres_data:
